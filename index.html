<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stellenwerttafel</title>
  <meta name="description" content="Interaktive Stellenwerttafel zum Bündeln und Entbündeln für Klasse 5">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='20' cy='32' r='14' fill='%23f5b523'/%3E%3Ccircle cx='44' cy='32' r='14' fill='%23ff7a68'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="title">Stellenwerttafel</h1>

    <div class="stepper" role="group" aria-label="Anzahl der Stellen">
      <button class="round-btn small" id="fewer-places" type="button" aria-label="Eine Stelle weniger">−</button>
      <span class="stepper-label"><strong id="place-count">6</strong> Stellen</span>
      <button class="round-btn small" id="more-places" type="button" aria-label="Eine Stelle mehr">+</button>
    </div>
  </header>

  <main class="board" id="board" aria-label="Stellenwerttafel"></main>

  <footer class="bottombar">
    <button class="pill-btn" id="toggle-number" type="button" aria-pressed="true">Zahl verbergen</button>
    <output class="number" id="number" aria-live="polite">0</output>
    <button class="pill-btn danger" id="clear" type="button">Alles löschen</button>
  </footer>

  <div class="bubble" id="bubble" role="status" aria-live="polite" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
